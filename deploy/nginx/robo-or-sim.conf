# Nginx đứng trước ứng dụng (cài không dùng Docker). Thay sim.example.vn bằng tên miền của bạn.
# Sau khi bật cấu hình này, chạy: sudo certbot --nginx -d sim.example.vn
# certbot sẽ tự thêm phần HTTPS (listen 443, chứng chỉ) và chuyển hướng HTTP sang HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name sim.example.vn;

    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
