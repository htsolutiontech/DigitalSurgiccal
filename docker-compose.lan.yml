# Dùng thêm tệp này khi chạy trong mạng nội bộ (không có tên miền công khai):
#   docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d --build
# Trong .env: DOMAIN là IP hoặc tên nội bộ của máy chủ, ACME_EMAIL để bất kỳ (không dùng),
# hoặc tạo .env bằng: python3 tools/init_env.py --lan
# Caddy tự cấp chứng chỉ nội bộ; máy sinh viên cần cài chứng chỉ gốc của Caddy (xem DEPLOY.md, mục 5).
services:
  caddy:
    volumes:
      - ./deploy/caddy/Caddyfile.lan:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
