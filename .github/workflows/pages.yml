# Đăng bản tự luyện (tĩnh) lên GitHub Pages mỗi khi đẩy mã lên nhánh main.
# Bật một lần: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Kiểm thử (gồm đối chiếu bộ chấm trình duyệt với bộ chấm Python)
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Dựng bản tĩnh
        run: python tools/build_static.py --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

